name: Build OrangeFox Star 4
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check System
        run: |
          echo "Dung luong o dia:"
          df -h
          echo "RAM:"
          free -h

      - name: Chuan bi moi truong
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 rsync
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync Source
        run: |
          mkdir work
          cd work
          git config --global user.name "hoangquocvietbro"
          git config --global user.email "viet@example.com"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_10.0
          repo sync -j$(nproc) --force-sync

      - name: Clone Device Tree
        run: |
          cd work
          git clone https://github.com/long266/twrp_device_vsmart_willowpro -b main device/vsmart/willowpro

      - name: Build
        run: |
          cd work
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_willowpro-eng || lunch twrp_willowpro-eng
          mka recoveryimage -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Star4
          path: work/out/target/product/willowpro/*.img
